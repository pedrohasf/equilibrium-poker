name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  rust:
    name: Rust core
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: core
      - name: cargo test
        run: cd core && cargo test --release

  swift:
    name: Swift app + tests
    # The package targets macOS 26 and needs the Xcode 26 / macOS 26 SDK. If the `macos-26`
    # image is unavailable for your account, use the newest macOS image and select Xcode 26
    # (see https://github.com/actions/runner-images).
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: core
      - name: Show toolchain
        run: xcodebuild -version && swift --version
      - name: Build Rust static library (linked by the Swift package)
        run: cd core && cargo build --release
      - name: swift build
        run: cd app && swift build
      - name: swift test
        run: cd app && swift test
