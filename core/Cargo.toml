[package]
name = "gto_core"
version = "0.1.0"
edition = "2021"
description = "Discounted-CFR postflop solver core for Equilibrium"

[lib]
crate-type = ["staticlib", "rlib"]

[dependencies]
rayon = "1.10"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
debug = false
